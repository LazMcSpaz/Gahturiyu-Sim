name: Pages

# Pages is served from Actions, not from a branch. The site is built from
# src/ on every push to main, so what is deployed is never a stale dist/.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one half-done.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build
        run: node build.js

      - name: Test
        run: node test/run.js

      # The page is one self-contained file. It is served at the site root so
      # the bare Pages URL works, and at dist/ so older links still resolve.
      - name: Stage the site
        run: |
          mkdir -p _site/dist
          cp dist/gahturiyu.html _site/index.html
          cp dist/gahturiyu.html _site/dist/gahturiyu.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
