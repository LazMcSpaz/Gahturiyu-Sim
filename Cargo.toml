[package]
name = "gahturiyu-sim"
version = "0.1.0"
edition = "2021"
description = "Gahturiyu: a banded, always-alive world simulation with a plain playtest window"
default-run = "gahturiyu"

[lib]
name = "gahturiyu_sim"
path = "src/lib.rs"

[[bin]]
name = "gahturiyu"
path = "src/main.rs"
test = false

[[bin]]
name = "headless"
path = "src/bin/headless.rs"

[dependencies]
bevy = { version = "=0.19.1", default-features = false, features = ["3d", "png", "tonemapping_luts", "default_font"] }
bevy_egui = { version = "=0.42.0", default-features = false, features = ["render", "default_fonts"] }
meshopt = "=0.6.2"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"

[profile.dev]
# The simulation is numeric; unoptimised Rust is painfully slow at it.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
