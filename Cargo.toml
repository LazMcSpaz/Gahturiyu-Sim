[package]
name = "gahturiyu-sim"
version = "0.1.0"
edition = "2021"
description = "Gahturiyu: a banded, always-alive world simulation with a plain playtest window"
default-run = "gahturiyu"

[lib]
name = "gahturiyu_sim"
path = "src/lib.rs"

[[bin]]
name = "gahturiyu"
path = "src/main.rs"
test = false

[[bin]]
name = "headless"
path = "src/bin/headless.rs"

[[bin]]
name = "town_forge"
path = "src/bin/town_forge/main.rs"

[dependencies]
bevy = { version = "=0.19.1", default-features = false, features = ["3d", "png", "tonemapping_luts", "default_font", "audio"] }
bevy_egui = { version = "=0.42.0", default-features = false, features = ["render", "default_fonts"] }
meshopt = "=0.6.2"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
serde_json = "1"
# The town forge's review images and step files.
image = { version = "0.25", default-features = false, features = ["png"] }
ab_glyph = "0.2"
ron = "0.12"
# The window's own handle, to keep the pointer in the window on Windows
# (view/thirdperson.rs: winit's grab didn't take there).
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[profile.dev]
# The simulation is numeric; unoptimised Rust is painfully slow at it.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
