group = "Roduro (Earth)"
label = "Thickness 4: Full native mouth: no lip sounds, no nose sounds, every beat open"
base = "kokoro:bm_george*0.5+hm_omega*0.5"
text = "You're not from here. What is it?"
accent = "roduro@4"

