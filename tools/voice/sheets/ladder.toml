# The accent ladder: each tongue from plain speech through its four steps.
# Lines were picked so that the steps change something you can hear in them.
# Make it with:  python tools/voice/voice.py sheet tools/voice/sheets/ladder.toml -o tools/voice/out/ladder

title = "Gahturiyu accents grown from the tongues"
text = "Mind the road."

[[item]]
id = "roduro3_a_0"
group = "Roduro (Earth)"
label = "Plain: the same speaker with no accent"
base = "kokoro:bm_george*0.5+hm_omega*0.5"
text = "Lock your doors tonight."
reading = "en-us"

[[item]]
id = "roduro3_a_1"
group = "Roduro (Earth)"
label = "Step 1 adds: the rhythm, the flicked r, steady vowels"
base = "kokoro:bm_george*0.5+hm_omega*0.5"
text = "Lock your doors tonight."
accent = "roduro@1"

[[item]]
id = "roduro3_a_2"
group = "Roduro (Earth)"
label = "Step 2 adds: k slips to the throat"
base = "kokoro:bm_george*0.5+hm_omega*0.5"
text = "Lock your doors tonight."
accent = "roduro@2"

[[item]]
