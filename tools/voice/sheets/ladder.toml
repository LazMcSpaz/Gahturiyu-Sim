# The accent ladder: each tongue from plain speech through the four steps that keep a line recognisable.
# Both lines were picked so that every step changes something you can hear in them.
# Make it with:  python tools/voice/voice.py sheet tools/voice/sheets/ladder.toml -o tools/voice/out/ladder

title = "Gahturiyu accents grown from the tongues"
text = "You have to make your own luck."

[[item]]
id = "roduro2_own_0"
group = "Roduro (Earth)"
label = "Plain: the same speaker with no accent"
base = "kokoro:bm_george*0.5+hm_omega*0.5"
text = "It will be remembered. Everything is."
reading = "en-us"

[[item]]
id = "roduro2_own_1"
group = "Roduro (Earth)"
label = "Step 1 adds: the rhythm, the flicked r, steady vowels"
base = "kokoro:bm_george*0.5+hm_omega*0.5"
text = "It will be remembered. Everything is."
accent = "roduro@1"

[[item]]
id = "roduro2_own_2"
group = "Roduro (Earth)"
label = "Step 2 adds: the tongue curls back on t and d; k slips to the throat"
base = "kokoro:bm_george*0.5+hm_omega*0.5"
text = "It will be remembered. Everything is."
accent = "roduro@2"

[[item]]
id = "roduro2_own_3"
group = "Roduro (Earth)"
label = "Step 3 adds: a catch between vowels; s becomes sh"
base = "kokoro:bm_george*0.5+hm_omega*0.5"
text = "It will be remembered. Everything is."
accent = "roduro@3"

[[item]]
id = "roduro2_own_4"
group = "Roduro (Earth)"
label = "Step 4 adds: stress moves next to last; inside words w hardens and f turns to breath"
base = "kokoro:bm_george*0.5+hm_omega*0.5"
text = "It will be remembered. Everything is."
accent = "roduro@4"

