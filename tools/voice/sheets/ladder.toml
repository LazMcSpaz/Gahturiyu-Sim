# The accent ladder: each tongue from plain speech to its full native mouth.
# Make it with:  python tools/voice/voice.py sheet tools/voice/sheets/ladder.toml -o tools/voice/out/ladder

title = "Gahturiyu accents grown from the tongues"
text = "Keep your hand on your purse round here. Mind the road."

[[item]]
id = "roduro_own_0"
group = "Roduro (Earth)"
label = "Plain: the same speaker with no accent"
base = "kokoro:bm_george*0.5+hm_omega*0.5"
text = "You're not from here. What is it?"
reading = "en-us"

[[item]]
id = "roduro_own_1"
group = "Roduro (Earth)"
label = "Thickness 1: The rhythm, a flicked r, steady vowels"
base = "kokoro:bm_george*0.5+hm_omega*0.5"
text = "You're not from here. What is it?"
accent = "roduro@1"

[[item]]
id = "roduro_own_2"
group = "Roduro (Earth)"
label = "Thickness 2: The tongue curls back on t and d; k slips to the throat; a catch between vowels"
base = "kokoro:bm_george*0.5+hm_omega*0.5"
text = "You're not from here. What is it?"
accent = "roduro@2"

[[item]]
id = "roduro_own_3"
group = "Roduro (Earth)"
label = "Thickness 3: s becomes sh; the lips begin to go; words want to end open"
