# Where each people's accent starts: its own tongue's habits, carried into
# plain speech.
#
# Each tongue has sounds it does not own. A speaker reaches for the nearest
# sound they do own, exactly as the naming system bends a borrowed word
# (assets/lang/sounds.ron, the *_borrows lists, on the naming branch). Those
# swaps, the tongue's word shape and its stress (assets/lang/grammar.ron), and
# its rhythm (languages.md) are the raw material.
#
# Laz's rule (2026-10-10): an accent on a plain-speech line must leave the
# words recognisable as the words on screen. So the four steps hold only
# the habits that pass that test, thickest last. They were chosen by adding
# one habit at a time, most telling first, and keeping it only while a
# speech-to-text listener still caught about four words in five across
# twelve of the game's lines (the level Laz marked "about right" by ear).
#
# [tongue.native] is everything the tongue's rules say. It stops being plain
# speech. Laz liked it as the sound of the native tongue; use it only for
# words in that tongue (thickness 5 in the panel, or NAME@native).
#
# A step only lists what it changes; thickness 3 is steps 1 to 3 laid over
# each other. Knobs and their variants are in sounds.toml.
#
# reading: "en-us" keeps the r after a vowel (purse, here), "en-gb" drops it.
# voices: raw voices whose own language already has this tongue's sounds, so
# they are likelier to say them well. Chosen by reasoning, not by ear.

# ---------------------------------------------------------------------- Roduro
# Owns: t ṭ q ʻ d ḍ g sh th h r l y, six vowels. No lip sounds, no nose sounds.
# Every beat is one consonant and one vowel. Stress next to last. Slow, low.
[roduro]
label = "Roduro (Earth)"
reading = "en-us"
voices = ["hm_omega", "hm_psi", "hf_alpha", "hf_beta", "im_nicola", "jm_kumo", "bm_george", "am_onyx", "bf_emma"]
mix = "bm_george*0.5+hm_omega*0.5"

[[roduro.step]]
what = "the rhythm, the flicked r, steady vowels"
delivery = { speed = 0.88, pause = 1.3, range = 0.85, pitch = -1.0 }
sounds = { r = "flick", diphthongs = "pure" }

[[roduro.step]]
what = "the tongue curls back on t and d; k slips to the throat"
sounds = { t_d = "curled", k_g = "throaty" }

[[roduro.step]]
what = "a catch between vowels; s becomes sh"
sounds = { joins = "catch", s = "hush" }

[[roduro.step]]
what = "stress moves next to last; inside words w hardens and f turns to breath"
sounds = { stress = "nextlast", w = "hard:light", f_v = "breath:light" }

# Left out of the steps because the words stop being recognisable: the lips and the nose (p, b, m, n to h, g and a curled-back d), six vowels only, echo vowels on every word, parted consonants.
[roduro.native]
sounds = { r = "flick", diphthongs = "split", t_d = "curled", k_g = "throaty", s = "hush", joins = "catch", stress = "nextlast", w = "hard", f_v = "breath", vowel_set = "six", endings = "echo", clusters = "part", p_b = "breath", m_n = "stopped" }

# ---------------------------------------------------------------------- Qotiro
# Owns: p t k q d g m n x r. No l, y, h, s, sh, th, f, w. Words close on hard
# consonants and stack them. Stress first. Short hard vowels. Clipped.
[qotiro]
label = "Qotiro (Fire)"
reading = "en-us"
voices = ["em_alex", "em_santa", "ef_dora", "im_nicola", "if_sara", "am_fenrir", "am_onyx", "bm_lewis", "af_kore"]
mix = "am_fenrir*0.5+em_alex*0.5"

[[qotiro.step]]
what = "clipped and forward; the rolled r; short vowels"
delivery = { speed = 1.08, pause = 0.75, range = 0.8, energy = 0.5, lilt = -1.0 }
sounds = { r = "roll", length = "clipped" }

[[qotiro.step]]
what = "th is t and d, h rasps, words end hard"
sounds = { th = "stop", h = "rasp", endings = "hard" }

[[qotiro.step]]
what = "the first beat is hit; day and go held steady; k from the throat"
sounds = { stress = "first", diphthongs = "pure", k_g = "throaty" }

[[qotiro.step]]
what = "l turns to r, w hardens to g, y hardens inside words"
sounds = { l = "r", w = "hard", y = "stop:light" }

# Left out of the steps because the words stop being recognisable: every hiss turned to the rasp, f to p, dulled vowels, weak last vowels dropped.
[qotiro.native]
sounds = { r = "roll", length = "clipped", stress = "first", th = "stop", h = "rasp", endings = "clipped", diphthongs = "pure", l = "r", w = "hard", y = "stop", f_v = "stop", vowel_set = "hard", s = "rasp" }

# ---------------------------------------------------------------------- Horaro
# Owns: l m n w r h and long vowels. No stops at all, no hisses. Open,
# vowel-heavy beats. Stress next to last, soft and drawn out.
[horaro]
label = "Horaro (Water)"
reading = "en-gb"
voices = ["pf_dora", "pm_alex", "ff_siwis", "jf_alpha", "jm_kumo", "bf_emma", "bf_isabella", "bm_daniel", "af_nicole"]
mix = "bf_emma*0.5+pf_dora*0.5"

[[horaro.step]]
what = "slow swells, held vowels, a gentle r"
delivery = { speed = 0.92, pause = 1.15, range = 1.15, energy = -0.4, breath = 0.15 }
sounds = { r = "flick", length = "long" }

[[horaro.step]]
what = "th melts to h; weak vowels round"
sounds = { th = "breath", vowel_set = "round:light" }

[[horaro.step]]
what = "inside words, k and g melt to h and w, p and b to w"
sounds = { k_g = "breath:light", p_b = "glide:light" }

[[horaro.step]]
what = "y opens to ee; ch and j soften"
sounds = { y = "vowel", ch_j = "soft" }

# Left out of the steps because the words stop being recognisable: every hiss to h, t and d to n and l, f to w, echo vowels, parted consonants, vowels said twice.
[horaro.native]
sounds = { r = "flick", length = "drawn", th = "breath", s = "breath", k_g = "breath", p_b = "glide", vowel_set = "round", f_v = "glide", t_d = "liquid", y = "vowel", endings = "echo", clusters = "part", ch_j = "soft", stress = "nextlast" }

# ---------------------------------------------------------------------- Ṭaḍoro
# Owns: f h s sh th w y, and gliding vowels. No stops, no nose sounds, no l,
# no r. Vowels blur toward "uh". Stress last, rising. Quick, light, breathy.
[tadoro]
label = "Ṭaḍoro (Air)"
reading = "en-gb"
voices = ["af_nicole", "af_heart", "bf_lily", "bm_fable", "am_puck", "zf_xiaoxiao", "zm_yunxi", "ff_siwis", "af_sky"]
mix = "bm_fable*0.6+af_nicole*0.4"

[[tadoro.step]]
what = "quick, light, rising; weak vowels blur; the last beat is hit"
delivery = { speed = 1.12, pause = 0.85, range = 1.1, lilt = 2.0, pitch = 1.0, breath = 0.3, energy = -0.2 }
sounds = { vowel_set = "blur:light", stress = "last" }

[[tadoro.step]]
what = "r softens toward w; inside words l melts to y"
sounds = { r = "soft", l = "glide:light" }

[[tadoro.step]]
what = "k and g thin to h and w"
sounds = { k_g = "breath" }

[[tadoro.step]]
what = "ch and j soften; inside words r is hissed like sh"
sounds = { ch_j = "soft", r = "hiss:light" }

# Left out of the steps because the words stop being recognisable: p, t and d thinned to f, s and th, nose sounds to w and y, the buzz gone, all vowels blurred, parted consonants.
[tadoro.native]
sounds = { vowel_set = "blur", stress = "last", r = "hiss", l = "glide", k_g = "breath", p_b = "hiss", t_d = "hiss", m_n = "glide", voicing = "unvoiced", clusters = "part", ch_j = "soft" }
