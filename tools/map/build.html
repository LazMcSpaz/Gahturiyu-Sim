<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gahturiyu Place Builder</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,600;1,400&family=Cinzel:wght@500;600&display=swap">
<style>
  /* A top-down 2D editor for one place, phone and iPad first: the ground fills the screen;
     along the bottom a tray of tools and things that folds to a tab; the picked tool's
     settings in a pill above it; the place's info top left; save and export top right. */
  :root {
    --umber: #231c14; --umber-2: #2f261b; --brass: #c9a24a; --brass-dim: #8f7439; --gold: #e8c76a;
    --text: #efe6d2; --dim: #b1a48b; --bad: #d6684f; --ink: #1d1710;
    --display: "Cinzel", "Georgia", serif; --body: "Alegreya", "Georgia", serif;
    --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { margin: 0; background: #5d6b45; color: var(--text); font-family: var(--body); font-size: 16px; overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
  button { font: 600 13px var(--display); letter-spacing: .05em; color: var(--text); background: var(--umber-2); border: 1px solid var(--brass-dim); border-radius: 6px; padding: 8px 10px; cursor: pointer; min-height: 44px; touch-action: manipulation; }
  button.primary { background: linear-gradient(180deg, var(--gold), var(--brass)); color: var(--ink); border-color: var(--brass); }
  button.danger { color: var(--bad); border-color: rgba(214,104,79,.5); }
  button.on { border-color: var(--gold); background: rgba(232,199,106,.2); box-shadow: inset 0 0 0 1px var(--gold); color: var(--gold); }
  button:focus-visible, input:focus, select:focus, textarea:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
  input, select, textarea { font: inherit; font-size: 16px; color: var(--text); background: var(--umber-2); border: 1px solid var(--brass-dim); border-radius: 6px; padding: 8px 10px; min-width: 0; width: 100%; box-sizing: border-box; min-height: 44px; }
  input[type=range] { min-height: 32px; padding: 0; accent-color: var(--gold); }
  #stage { position: absolute; inset: 0; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
  #stage.brush { cursor: crosshair; }
  #stage.panning { cursor: grabbing; }
  #cv { display: block; position: absolute; left: 0; top: 0; }

  /* Top left: the place. */
  #info { position: absolute; left: 8px; top: calc(60px + var(--sat)); z-index: 4; background: rgba(35,28,20,.94); border: 1px solid var(--brass-dim); border-top: 3px solid var(--brass); border-radius: 6px; padding: 6px 10px; max-width: min(320px, calc(100vw - 16px)); box-shadow: 0 4px 16px rgba(0,0,0,.4); }
  #info h1 { font: 600 14px var(--display); letter-spacing: .08em; color: var(--gold); margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #info .line { font-size: 13px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #info .line b { color: var(--text); font-weight: 600; }
  #info.open .more { display: block; }
  #info .more { display: none; font-size: 13px; margin-top: 4px; max-height: 40vh; overflow: auto; }
  #info .more .roles span { display: inline-block; background: var(--umber-2); border: 1px solid var(--brass-dim); border-radius: 12px; padding: 2px 8px; margin: 2px 4px 2px 0; }
  #info .more textarea { margin-top: 6px; min-height: 60px; font-size: 14px; }
  #info .more .row { display: flex; gap: 6px; margin-top: 6px; }
  #info .more .row button { flex: 1; min-height: 40px; padding: 6px; }

  /* Top right: save, export, back. */
  #top { position: absolute; right: 8px; top: calc(8px + var(--sat)); z-index: 4; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  #bar { display: flex; gap: 6px; background: rgba(35,28,20,.94); border: 1px solid var(--brass-dim); border-radius: 6px; padding: 5px 6px; }
  #bar button { min-height: 40px; padding: 6px 10px; }
  #status { font-size: 13px; color: var(--dim); background: rgba(35,28,20,.85); border-radius: 4px; padding: 3px 8px; max-width: 60vw; text-align: right; }
  #status.bad { color: var(--bad); }
  #status:empty { display: none; }
  @media (min-width: 700px) { #info { top: calc(8px + var(--sat)); } }
  #scale { position: absolute; left: 8px; bottom: calc(var(--tray-h, 160px) + 10px + var(--sab)); color: var(--ink); font-size: 12px; font-variant-numeric: tabular-nums; pointer-events: none; z-index: 3; background: rgba(239,230,210,.6); padding: 2px 6px; border-radius: 3px; }
  #scale .bar { height: 3px; background: var(--ink); border-left: 2px solid var(--ink); border-right: 2px solid var(--ink); margin-bottom: 2px; }

  /* The handles on a picked thing (drawn as DOM so they stay thumb-sized at any zoom). */
  .handle { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; z-index: 5; display: flex; align-items: center; justify-content: center; touch-action: none; }
  .handle::after { content: ""; width: 26px; height: 26px; border-radius: 50%; background: var(--gold); border: 2px solid var(--ink); box-shadow: 0 2px 6px rgba(0,0,0,.5); }
  .handle.remove::after { background: var(--bad); }
  .handle svg { position: absolute; width: 16px; height: 16px; pointer-events: none; }
  .handle[hidden] { display: none; }
  #thing-sheet { position: absolute; left: 8px; right: 8px; bottom: calc(var(--tray-h, 160px) + 8px + var(--sab)); z-index: 5; background: rgba(35,28,20,.96); border: 1px solid var(--brass-dim); border-top: 3px solid var(--brass); border-radius: 8px; padding: 8px 10px; display: grid; grid-template-columns: 1fr auto auto; gap: 6px 8px; align-items: center; }
  #thing-sheet[hidden] { display: none; }
  #thing-sheet .k { font-size: 12px; color: var(--dim); grid-column: 1 / -1; }
  #thing-sheet input { min-height: 40px; }
  #thing-sheet button { min-height: 40px; }

  /* The tray along the bottom: tool tabs, then the tool's own strip. */
  #tray { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; background: rgba(35,28,20,.95); border-top: 1px solid var(--brass-dim); padding-bottom: var(--sab); display: flex; flex-direction: column; }
  #tray.min #tools, #tray.min #strip, #tray.min #pill { display: none; }
  #grip { display: flex; justify-content: center; padding: 4px 0 2px; }
  #grip button { min-height: 28px; padding: 2px 30px; border-radius: 14px; font-size: 12px; }
  #tools { display: flex; gap: 4px; padding: 4px 8px; overflow-x: auto; scrollbar-width: none; }
  #tools::-webkit-scrollbar { display: none; }
  #tools button { flex: none; min-width: 64px; min-height: 48px; padding: 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; }
  #tools button svg { width: 22px; height: 22px; }
  #pill { display: flex; gap: 10px; align-items: center; padding: 4px 12px; font-size: 13px; color: var(--dim); flex-wrap: wrap; }
  #pill[hidden] { display: none; }
  #pill label { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  #pill input[type=range] { width: 110px; }
  #pill .swatches { display: flex; gap: 4px; flex-wrap: wrap; }
  #pill .sw { width: 40px; height: 40px; border-radius: 6px; border: 2px solid transparent; padding: 0; min-height: 0; }
  #pill .sw.on { border-color: var(--gold); box-shadow: 0 0 0 1px var(--ink) inset; }
  #strip { display: flex; gap: 6px; padding: 4px 8px 8px; overflow-x: auto; scrollbar-width: none; min-height: 84px; align-items: flex-end; }
  #strip::-webkit-scrollbar { display: none; }
  #strip[hidden] { display: none; }
  .pal { flex: none; width: 84px; min-height: 84px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 3px; padding: 4px 2px 5px; border: 1px solid transparent; border-radius: 8px; cursor: grab; touch-action: none; color: var(--text); background: none; }
  .pal.on { border-color: var(--gold); background: rgba(232,199,106,.18); }
  .pal canvas { width: 60px; height: 50px; pointer-events: none; }
  .pal span { font: 500 10px var(--display); letter-spacing: .02em; color: var(--dim); white-space: normal; text-align: center; line-height: 1.15; pointer-events: none; }
  .pal.head { width: auto; min-height: 0; align-self: center; padding: 0 6px; cursor: default; }
  .pal.head span { color: var(--gold); writing-mode: vertical-rl; transform: rotate(180deg); font-size: 11px; letter-spacing: .12em; }
  #ghost { position: absolute; pointer-events: none; display: none; z-index: 9; }
  #ghost canvas { width: 70px; height: 70px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.6)); }
  @media (min-width: 900px) and (min-height: 600px) {
    #tray { left: auto; right: 8px; bottom: 8px; width: 360px; border: 1px solid var(--brass-dim); border-radius: 8px; max-height: 60vh; }
    #strip { flex-wrap: wrap; align-items: flex-start; overflow-y: auto; max-height: 34vh; }
    #thing-sheet { left: 8px; right: auto; width: 320px; bottom: 8px; }
    #scale { bottom: 10px; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="h-move" class="handle" hidden><svg viewBox="0 0 16 16"><path d="M8 1v14M1 8h14M8 1l-2 2M8 1l2 2M8 15l-2-2M8 15l2-2M1 8l2-2M1 8l2 2M15 8l-2-2M15 8l-2 2" stroke="#1d1710" stroke-width="1.6" fill="none"/></svg></div>
  <div id="h-rot" class="handle" hidden><svg viewBox="0 0 16 16"><path d="M3 9a5 5 0 1 0 2-4" stroke="#1d1710" stroke-width="1.8" fill="none"/><path d="M5 2v3h-3" stroke="#1d1710" stroke-width="1.8" fill="none"/></svg></div>
  <div id="h-scale" class="handle" hidden><svg viewBox="0 0 16 16"><path d="M3 13L13 3M13 3h-5M13 3v5M3 13h5M3 13V8" stroke="#1d1710" stroke-width="1.8" fill="none"/></svg></div>
  <div id="h-remove" class="handle remove" hidden><svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" stroke="#1d1710" stroke-width="2"/></svg></div>
  <div id="ghost"><canvas width="140" height="140"></canvas></div>
</div>

<div id="info"><h1 id="i-title">Place</h1><div class="line" id="i-cap">…</div>
  <div class="more">
    <div class="roles" id="i-roles"></div>
    <div class="line" id="i-counts"></div>
    <textarea id="i-notes" placeholder="Notes for the place (who holds it, what it's for, what Claude should know)"></textarea>
    <div class="row"><button id="i-undo">Undo</button><button id="i-fit">Fit</button><button id="i-grid">Grid</button><button id="i-trees">Land’s trees</button></div>
  </div>
</div>
<div id="top">
  <div id="bar"><button id="back">Map</button><button id="export">Export</button><button id="send" class="primary">Send to Claude</button></div>
  <div id="status"></div>
</div>
<div id="scale"><div class="bar" id="scalebar"></div><span id="scaletext">20 m</span></div>

<div id="thing-sheet" hidden>
  <input id="t-label" placeholder="what this one is called" autocomplete="off" enterkeyhint="done">
  <input id="t-room" type="number" min="0" max="200" step="1" style="width:84px" aria-label="Beds">
  <button id="t-done" class="primary">Done</button>
  <div class="k" id="t-kind"></div>
</div>

<div id="tray">
  <div id="grip"><button id="grip-btn" aria-label="Fold or unfold the tray">▾ tray</button></div>
  <div id="tools"></div>
  <div id="pill" hidden></div>
  <div id="strip"></div>
</div>

</div>

<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const stage = $("stage"), cv = $("cv"), ctx = cv.getContext("2d");
  const say = (t, bad) => { const s = $("status"); s.textContent = t; s.classList.toggle("bad", !!bad); };
  const params = new URLSearchParams(location.search);
  const KEY = (params.get("key") || "unnamed_place").replace(/[^a-z0-9_]/g, "_");
  const NAME = params.get("name") || KEY;

  // ---- the catalogue: every thing the game can stand up, with its real footprint. The
  //      game writes assets/world/catalogue.json (headless catalogue); until it's beside this
  //      page, this built-in list stands in, with the same keys and the game's sizes. ----
  const JOBN = (j) => j.replace(/([a-z])([A-Z])/g, "$1 $2").toLowerCase().replace(/^./, (c) => c.toUpperCase());
  const B = (key, name, people, glyph, depth, width, o) => Object.assign({ key, name, group: "building", people, glyph, shape: "rect", depth, width, storeys: 1, beds: 0, jobs: [], scalable: true, rotatable: true }, o || {});

  let CATALOGUE = [
    // Roduro: grown stone, round.
    B("roduro_cottage", "Cottage", "roduro", "roduro", 8, 6.4, { shape: "round", beds: 3 }),
    B("roduro_longhouse", "Longhouse", "roduro", "roduro", 11, 7, { shape: "round", beds: 4 }),
    B("roduro_great", "Great house", "roduro", "roduro", 12.5, 10, { shape: "round", beds: 6, storeys: 2 }),
    B("roduro_forge", "Smith's house", "roduro", "roduro", 10, 8, { shape: "round", beds: 3, jobs: SMITHS, stations: ["Forge"] }),
    B("roduro_loomroom", "Weaver's house", "roduro", "roduro", 10, 8, { shape: "round", beds: 3, jobs: LOOM, stations: ["Loom"] }),
    B("roduro_benchroom", "Bench house", "roduro", "roduro", 10, 8, { shape: "round", beds: 3, jobs: BENCH, stations: ["Workbench"] }),
    B("roduro_tender", "Stone tender's house", "roduro", "roduro", 10, 8, { shape: "round", beds: 3, jobs: ["StoneTender"], stations: ["GrowerBed"] }),
    B("roduro_trader", "Trader's house", "roduro", "roduro", 10, 8, { shape: "round", beds: 3, jobs: TRADE }),
    // Qotiro: quarried, stepped boxes in dark stone.
    B("qotiro_quarters", "Living quarters", "qotiro", "qotiro", 15, 12, { storeys: 3, beds: 7 }),
    B("qotiro_court", "Courtyard house", "qotiro", "qotiro_court", 18, 14.4, { storeys: 2, beds: 5 }),
    B("qotiro_workyard", "Smiths' yard", "qotiro", "qotiro_yard", 15, 12, { storeys: 2, beds: 4, jobs: SMITHS, stations: ["Forge", "Anvil"] }),
    B("qotiro_benchyard", "Bench yard", "qotiro", "qotiro_yard", 15, 12, { storeys: 2, beds: 4, jobs: BENCH, stations: ["Workbench"] }),
    B("qotiro_weavehall", "Weaving hall", "qotiro", "qotiro", 15, 12, { storeys: 2, beds: 4, jobs: LOOM, stations: ["Loom"] }),
    B("qotiro_market", "Market house", "qotiro", "qotiro", 15, 12, { storeys: 2, beds: 4, jobs: TRADE }),
    B("qotiro_mess", "Mess hall", "qotiro", "qotiro", 14, 11.2, { storeys: 1, jobs: ["Cook"] }),
    B("qotiro_temple", "Temple-fortress", "qotiro", "temple", 20, 20, { storeys: 3, beds: 6, jobs: ["Priest"] }),
    B("qotiro_island_hall", "Qotiro hall", "qotiro", "hall", 14, 11.2, { storeys: 2, jobs: ["Priest"] }),
    // Horaro: domes on stilts off the shore (place them on water).
    B("horaro_dome", "Stilt dome", "horaro", "horaro", 8, 8, { shape: "round", beds: 4 }),
    B("horaro_twin", "Twin dome", "horaro", "horaro", 10, 10, { shape: "round", beds: 6 }),
    B("horaro_hull", "Hull house", "horaro", "horaro", 9, 7, { shape: "round", beds: 4 }),
    B("horaro_net_loft", "Net loft", "horaro", "horaro", 9, 9, { shape: "round", beds: 2, jobs: ["Fisher"] }),
    // Camp and base buildings (anyone's; timber and rubble).
    B("hut", "Hut", "any", "hut", 5, 4, { group: "base", beds: 2 }),
    B("lean_to", "Lean-to", "any", "leanto", 3, 2.5, { group: "base", beds: 1 }),

    B("fields", "Fields", "any", "field", 34, 34, { group: "workplace", jobs: ["Farmer"] }),

    B("woodlot", "Woodlot", "any", "woodlot", 22, 22, { group: "workplace", jobs: ["Woodcutter"] }),

    B("smithy", "Smithy", "any", "yard", 7, 7, { group: "workplace", jobs: ["Smith"], stations: ["Forge"] }),
    B("bench", "Armourer's shop", "any", "yard", 7, 7, { group: "workplace", jobs: ["Armourer"], stations: ["Bench"] }),
    B("desk", "Scribe's room", "any", "shop", 7, 7, { group: "workplace", jobs: ["Scribe"], stations: ["Desk"] }),
    B("alchemy_table", "Alchemist's shop", "any", "shop", 7, 7, { group: "workplace", jobs: ["Alchemist"], stations: ["AlchemyTable"] }),

    B("pen_turiyu", "Turiyu pasture", "any", "pen", 14, 14, { group: "pen", shape: "round", species: "turiyu" }),

    // Props: things that stand about.
    B("rock_small", "Rock", "any", "rock", 1.2, 1.0, { group: "prop" }),
    B("rock_large", "Boulder", "any", "rock", 3, 2.4, { group: "prop" }),
    B("timber_stack", "Timber stack", "any", "logs", 4, 2, { group: "prop" }),
    B("garden_plot", "Garden plot", "any", "garden", 4, 3, { group: "prop" }),
    B("bedroll", "Bedroll", "any", "bedroll", 2, 0.8, { group: "prop" }),
    B("tent", "Tent", "any", "tent", 3, 3, { group: "prop" }),
    B("campfire", "Campfire", "any", "fire", 1.5, 1.5, { group: "prop", shape: "round", rotatable: false }),
    B("standing_torch", "Standing torch", "any", "torch", 0.6, 0.6, { group: "prop", shape: "round", rotatable: false }),

  });
  function endPointer(e) {
    if (!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinch = null;
    if (pointers.size > 0) return;
    stage.classList.remove("panning");
    if (painting) { painting = false; brushAt = null; changed(); draw(); }
    else if (pan && !moved && e.type === "pointerup") {
      const p = toW(e.clientX, e.clientY);
      if (tool && tool.k === "roads") draftPoint(p);
      else if (armedKey) addThing(armedKey, p.x, p.y);
      else { const t = thingAt(p); pick(t); }
    }
    pan = null; downAt = null;
  }
  stage.addEventListener("pointerup", endPointer); stage.addEventListener("pointercancel", endPointer);
  document.addEventListener("keydown", (e) => {
    if (e.target.matches("input, textarea, select")) return;
    if (e.key === "Escape") { pick(null); armedKey = null; if (draft) finishDraft(); buildStrip(); }
    if ((e.key === "Delete" || e.key === "Backspace") && picked) removePicked();
    if ((e.key === "z" || e.key === "Z") && (e.ctrlKey || e.metaKey)) { e.preventDefault(); undo(); }
    if (e.key === "Enter" && draft) finishDraft();
  });

  // ---- brushes ----
  // A stroke is dabbed every half cell along the way, so a fast finger leaves no gaps.
  function paint(p) {
    if (lastPaint) {
      const L = Math.hypot(p.x - lastPaint.x, p.y - lastPaint.y);
      if (L < CELL * 0.5) return;
      const n = Math.ceil(L / (CELL * 0.5)), from = lastPaint;
      for (let i = 1; i <= n; i++) dab({ x: from.x + (p.x - from.x) * i / n, y: from.y + (p.y - from.y) * i / n });
    } else dab(p);
    lastPaint = p;
    draw();
  }
  function dab(p) {
    const R = brushSize(), k = tool.k, mode = k === "erase" ? (settings.erase || "plants") : k;
    const i0 = Math.max(0, Math.floor((p.x - R) / CELL + P.origin[0])), i1 = Math.min(GW - 1, Math.ceil((p.x + R) / CELL + P.origin[0]));
    const j0 = Math.max(0, Math.floor((p.y - R) / CELL + P.origin[1])), j1 = Math.min(GH - 1, Math.ceil((p.y + R) / CELL + P.origin[1]));
    if (mode === "ground") { terrainDirty = true; for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) { const [cx, cy] = cellXY(j * GW + i); if (Math.hypot(cx - p.x, cy - p.y) <= R) ground[j * GW + i] = k === "erase" ? "." : groundKey; } }
    else if (mode === "height") {
      // Every change starts from the ground as it stands (the land's own where untouched);
      // erasing hands a cell back to the land.
      terrainDirty = contoursDirty = true;
      const soft = settings.soft, str = settings.strength * 0.25;
      let mean = 0, n = 0; if (heightMode === "smooth" || heightMode === "flat") { for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) { const [cx, cy] = cellXY(j * GW + i); if (Math.hypot(cx - p.x, cy - p.y) <= R) { mean += hAt(j * GW + i); n++; } } mean = n ? mean / n : 0; }
      const was = Float32Array.from({ length: (j1 - j0 + 1) * (i1 - i0 + 1) }, (_, q) => hAt((j0 + Math.floor(q / (i1 - i0 + 1))) * GW + i0 + (q % (i1 - i0 + 1))));
      const before = (i, j) => (i >= i0 && i <= i1 && j >= j0 && j <= j1 ? was[(j - j0) * (i1 - i0 + 1) + (i - i0)] : hAt(j * GW + i));
      for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
        const idx = j * GW + i, [cx, cy] = cellXY(idx), d = Math.hypot(cx - p.x, cy - p.y); if (d > R) continue;
        const fall = soft > 0 ? Math.pow(Math.max(0, 1 - d / R), 0.4 + soft * 2) : 1, h0 = before(i, j);
        if (k === "erase") { if (Number.isNaN(height[idx])) continue; const to = h0 + (natH[idx] - h0) * Math.min(1, fall * 0.8); height[idx] = Math.abs(to - natH[idx]) < 0.3 ? NaN : to; }
        else if (heightMode === "raise") height[idx] = Math.min(25, h0 + str * fall);
        else if (heightMode === "lower") height[idx] = Math.max(-26, h0 - str * fall);
        else if (heightMode === "flat") height[idx] = h0 + (mean - h0) * fall * 0.5;
        else { let s = 0, c = 0; for (const [di, dj] of [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]]) { const ii = i + di, jj = j + dj; if (ii >= 0 && jj >= 0 && ii < GW && jj < GH) { s += before(ii, jj); c++; } } height[idx] = h0 + (s / c - h0) * fall * 0.6; }
      }
    }
    else if (mode === "plants") {
      if (k === "erase") { P.foliage = P.foliage.filter((f) => Math.hypot(f.x - p.x, f.y - p.y) > R); }
      else {
        // Stamps thrown into the circle at the density asked, kept apart by their own size.
        const sz = FOLIAGE.find((f) => f[0] === plantKey)[2], want = Math.max(1, Math.round(settings.density * Math.PI * R * R / (sz * sz * 1.3)));
        for (let n = 0; n < want; n++) {
          const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * R, x = p.x + Math.cos(a) * r, y = p.y + Math.sin(a) * r;
          if (P.foliage.some((f) => f.k === plantKey && Math.hypot(f.x - x, f.y - y) < sz * 0.8)) continue;
          if (P.things.some((t) => { const d = CAT[t.k]; return d && Math.hypot(t.x - x, t.y - y) < Math.max(d.depth, d.width) * (t.s || 1) * 0.5 + 0.5; })) continue;
          P.foliage.push({ k: plantKey, x: Math.round(x * 10) / 10, y: Math.round(y * 10) / 10, s: Math.round((0.8 + Math.random() * 0.45) * 100) / 100 });
        }
      }
    }
    else if (mode === "things") { P.things = P.things.filter((t) => Math.hypot(t.x - p.x, t.y - p.y) > R); if (picked && !P.things.includes(picked)) pick(null); }
  }

  // ---- roads ----
  let draft = null;
  function draftPoint(p) { if (!draft) draft = { k: roadKey, pts: [] }; draft.pts.push([Math.round(p.x * 10) / 10, Math.round(p.y * 10) / 10]); draw(); say(draft.pts.length < 2 ? "Tap the next point." : `${draft.pts.length} points. Tap on, or Finish.`); }
  function finishDraft() { if (!draft) return; const d = draft; draft = null; if (d.pts.length >= 2) { snapshot(); P.roads.push({ k: d.k, w: ROAD[d.k][2], pts: d.pts }); changed(); } draw(); }

  // ---- things: place, pick, handles ----
  let picked = null;
  const nid = () => "t" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  function addThing(key, x, y) {
    const d = CAT[key]; if (!d) return;
    snapshot();
    const t = { id: nid(), k: key, x: Math.round(x * 10) / 10, y: Math.round(y * 10) / 10, rot: 0, s: 1, label: "", room: d.beds || 0, note: "" };
    // Face the centre, as the game's own layouts do.
    if (d.rotatable !== false) t.rot = (Math.round(Math.atan2(-y, -x) * 180 / Math.PI) + 360) % 360;
    P.things.push(t); changed(); pick(t);
  }
  function thingAt(p) {
    let best = null, bd = Infinity;
    for (const t of P.things) { const d = CAT[t.k]; if (!d) continue; const s = t.s || 1; const a = -(t.rot || 0) * Math.PI / 180; const dx = p.x - t.x, dy = p.y - t.y; const lx = dx * Math.cos(a) - dy * Math.sin(a), ly = dx * Math.sin(a) + dy * Math.cos(a); const inside = d.shape === "round" ? (lx / (d.depth * s / 2)) ** 2 + (ly / (d.width * s / 2)) ** 2 <= 1.3 : Math.abs(lx) <= d.depth * s / 2 + 0.6 && Math.abs(ly) <= d.width * s / 2 + 0.6; if (inside) { const area = d.depth * d.width * s * s; if (area < bd) { bd = area; best = t; } } }
    return best;
  }
  const sheet = $("thing-sheet");
  function pick(t) {
    picked = t || null;
    sheet.hidden = !picked;
    if (picked) { const d = CAT[picked.k]; $("t-label").value = picked.label || ""; $("t-room").value = picked.room || 0; $("t-room").style.display = d.beds || d.group === "building" || d.group === "base" ? "" : "none"; $("t-kind").textContent = `${d.name} · ${(d.depth * (picked.s || 1)).toFixed(1)} × ${(d.width * (picked.s || 1)).toFixed(1)} m · facing ${Math.round(picked.rot || 0)}°${d.beds ? " · " + d.beds + " bed" + (d.beds === 1 ? "" : "s") + (d.extra_beds ? ", room for " + d.extra_beds + " more on bedrolls" : "") : ""}${d.missing ? " · the game has no shape for this yet: it's noted for later" : ""}`; }
    draw();
  }
  $("t-label").addEventListener("input", () => { if (picked) { picked.label = $("t-label").value.trim(); changed(); draw(); } });
  $("t-room").addEventListener("change", () => { if (picked) { picked.room = Math.max(0, Math.round(Number($("t-room").value) || 0)); changed(); info(); } });
  $("t-label").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); $("t-label").blur(); pick(null); } });
  $("t-done").addEventListener("click", () => pick(null));
  function removePicked() { if (!picked) return; snapshot(); P.things = P.things.filter((t) => t !== picked); pick(null); changed(); }
  function placeHandles() {
    const H = { move: $("h-move"), rot: $("h-rot"), scale: $("h-scale"), remove: $("h-remove") };
    for (const k in H) H[k].hidden = !picked;
    if (!picked) return;
    const d = CAT[picked.k], s = picked.s || 1, a = (picked.rot || 0) * Math.PI / 180;
    const off = (lx, ly) => { const x = picked.x + lx * Math.cos(a) - ly * Math.sin(a), y = picked.y + lx * Math.sin(a) + ly * Math.cos(a); const sp = toS(x, y); const r = stage.getBoundingClientRect(); return [sp.x - r.left, sp.y - r.top]; };
    const D = d.depth * s / 2, W = d.width * s / 2, pad = 36 / z;
    const set = (el, p) => { el.style.left = p[0] + "px"; el.style.top = p[1] + "px"; };
    set(H.move, off(0, 0)); set(H.rot, off(D + pad, 0)); set(H.scale, off(D * 0.7 + pad * 0.7, W * 0.7 + pad * 0.7)); set(H.remove, off(-D * 0.7 - pad * 0.7, -W * 0.7 - pad * 0.7));
    H.rot.hidden = d.rotatable === false; H.scale.hidden = d.scalable === false;
  }
  function handleDrag(el, onMove, onStart) {
    let st = null;
    el.addEventListener("pointerdown", (e) => { if (!picked) return; e.stopPropagation(); el.setPointerCapture(e.pointerId); snapshot(); st = onStart ? onStart(e) : {}; });
    el.addEventListener("pointermove", (e) => { if (!st) return; onMove(e, st); draw(); });
    const end = () => { if (st) { st = null; changed(); pick(picked); } };
    el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
  }
  handleDrag($("h-move"), (e, st) => { const p = toW(e.clientX, e.clientY); picked.x = Math.round((p.x - st.dx) * 10) / 10; picked.y = Math.round((p.y - st.dy) * 10) / 10; }, (e) => { const p = toW(e.clientX, e.clientY); return { dx: p.x - picked.x, dy: p.y - picked.y }; });
  handleDrag($("h-rot"), (e) => { const p = toW(e.clientX, e.clientY); let a = Math.atan2(p.y - picked.y, p.x - picked.x) * 180 / Math.PI; if (!e.shiftKey) a = Math.round(a / 5) * 5; picked.rot = Math.round(((a % 360) + 360) % 360); });
  handleDrag($("h-scale"), (e, st) => { const p = toW(e.clientX, e.clientY); const d = Math.hypot(p.x - picked.x, p.y - picked.y); picked.s = Math.round(Math.max(0.4, Math.min(4, st.s0 * d / st.d0)) * 20) / 20; }, (e) => { const p = toW(e.clientX, e.clientY); return { s0: picked.s || 1, d0: Math.max(0.5, Math.hypot(p.x - picked.x, p.y - picked.y)) }; });
  $("h-remove").addEventListener("pointerdown", (e) => e.stopPropagation());
  $("h-remove").addEventListener("click", removePicked);

  // ---- info: capacity and roles, from the catalogue ----
  function info() {
    $("i-title").textContent = P.title || KEY;
    let beds = 0; const roles = {}, counts = {};
    for (const t of P.things) { const d = CAT[t.k]; if (!d) continue; beds += t.room || 0; for (const j of d.jobs || []) roles[j] = (roles[j] || 0) + 1; counts[d.group] = (counts[d.group] || 0) + 1; }
    $("i-cap").innerHTML = `Room for <b>${beds}</b> · ${Object.keys(roles).length} kinds of work · tap for more`;
    $("i-roles").innerHTML = Object.keys(roles).sort().map((j) => `<span>${JOBN(j)} × ${roles[j]}</span>`).join("") || '<span style="color:var(--dim)">No workplaces yet.</span>';
    $("i-counts").textContent = `${P.things.length} things, ${P.foliage.length} plants and rocks, ${P.roads.length} roads · ${GW * CELL} × ${GH * CELL} m${LAND ? ` · the land of world ${LAND.seed}` : ""}`;
  }
  $("info").addEventListener("click", (e) => { if (e.target.closest("textarea, button")) return; $("info").classList.toggle("open"); });
  $("i-notes").addEventListener("input", () => { P.notes = $("i-notes").value; changed(); });
  $("i-undo").addEventListener("click", undo); $("i-fit").addEventListener("click", fit); $("i-grid").addEventListener("click", () => { showGrid = !showGrid; draw(); });
  $("i-trees").addEventListener("click", () => { if (!LAND) { say("No picture of the land here yet.", true); return; } snapshot(); const n = landPlants(); if (n) changed(); draw(); say(n ? `Put back ${n} of the land’s own trees and bushes.` : "The land’s trees are all here already."); });

  // ---- undo, save, export ----
  const undoStack = [];
  // (An untouched cell is written "." : the land's own height there.)
  function serialize() { P.ground = ground.join(""); P.height = Array.from(height, (h) => Number.isNaN(h) ? "." : chOf(h)).join(""); return JSON.stringify(Object.assign({}, P, { saved: new Date().toISOString() })); }
  function restore(json) {
    const o = JSON.parse(json);
    Object.assign(P, { title: o.title || P.title, notes: o.notes || "", foliage: o.foliage || [], roads: o.roads || [], things: o.things || [] });
    if (o.size && o.size[0] === GW && o.size[1] === GH) { ground = (o.ground || "").padEnd(GW * GH, ".").slice(0, GW * GH).split(""); const hs = (o.height || "").padEnd(GW * GH, "."); for (let k = 0; k < GW * GH; k++) height[k] = hOf(hs[k]); }
    terrainDirty = contoursDirty = true;
    $("i-notes").value = P.notes; info(); draw();
  }
  function snapshot() { undoStack.push(serialize()); if (undoStack.length > 30) undoStack.shift(); }
  function undo() { const s = undoStack.pop(); if (!s) { say("Nothing to undo."); return; } restore(s); pick(null); changed(); }
  let db = null, canWrite = true, saveTimer = null, dirty = false;
  function changed() { dirty = true; info(); clearTimeout(saveTimer); saveTimer = setTimeout(store, 700); }
  // Every change is kept in this browser first (so a lost connection loses nothing), then in
  // the shared store when there is one. Opening the place takes whichever is newer.
  async function store() {
    const json = serialize();
    let local = false;
    try { localStorage.setItem("place:" + KEY, json); local = true; } catch (e) {}
    if (!db || !canWrite) { say(local ? "Kept in this browser" + (db ? " (read only here)." : " (not signed in: nothing shared).") : "Couldn't keep it: this browser refuses storage.", !local); return; }
    try { await db.collection("places").doc(KEY).set({ json, title: P.title, saved: Date.now() }); dirty = false; say("Saved (here and shared)."); }
    catch (e) { say("Kept in this browser; the shared copy failed: " + (e.message || e.code), true); }
  }
  (async () => {
    try { db = await window.claude?.use?.("db"); const user = await window.claude?.use?.("user"); if (user && typeof user.can === "function") { const w = await user.can("data.write"); if (w === false) canWrite = false; } } catch (e) { db = null; }
    const landed = await landReady;
    let shared = null, local = null;
    if (db) { try { const d = await db.collection("places").doc(KEY).get(); const v = d && d.data && d.data(); if (v && v.json) shared = v.json; } catch (e) { say("Couldn't reach the shared copy: " + (e.message || e.code), true); } }
    try { local = localStorage.getItem("place:" + KEY); } catch (e) {}
    const when = (j) => { try { return Date.parse(JSON.parse(j).saved) || 0; } catch (e) { return 0; } };
    const pick = shared && local ? (when(local) > when(shared) ? local : shared) : (shared || local);
    if (pick) { restore(pick); say(pick === local && shared ? "Loaded this browser's newer copy." : "Loaded."); if (pick === local && db && canWrite) store(); }
    else if (landed) { const n = landPlants(); draw(); say(`The land as the game has it here, with its own ${n} trees and bushes: erase any you don't want.`); }
    else say("A blank place (no picture of the land here yet). Pick a tool below.");
    info();
    if (landed) glideIn();
  })();
  // Open on Laz's map round the place and glide down into it.
  function glideIn() {
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const r = stage.getBoundingClientRect(), trayH = Math.min(260, $("tray").getBoundingClientRect().height || 170);
    const end = Math.min(r.width, r.height - trayH) / 110, start = Math.min(r.width, r.height - trayH) / 9000;
    const cx = r.width / 2, cy = (r.height - trayH) / 2, t0 = performance.now(), T = 1600;
    const step = (now) => { const u = Math.min(1, (now - t0) / T), e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2; z = Math.exp(Math.log(start) + (Math.log(end) - Math.log(start)) * e); tx = cx; ty = cy; draw(); if (u < 1 && !pointers.size) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }
  async function exportFile() {
    const text = serialize();
    try { const dl = await window.claude?.use?.("downloads"); if (dl) { await dl.save({ filename: KEY + ".json", data: text }); say("Exported " + KEY + ".json."); return; } } catch (e) {}
    try { await navigator.clipboard.writeText(text); say("Copied the place file to the clipboard."); } catch (e) { say("Couldn't export here.", true); }
  }
  $("export").addEventListener("click", exportFile);
  $("back").addEventListener("click", () => { if (dirty) store(); location.href = "index.html"; });

  // Send to Claude: the place is in the shared store already (every change); this marks it as
  // handed over, and Claude writes assets/world/places/<key>.json into the repo from there.
  // (The page can't reach GitHub itself: the viewer blocks calls out.)
  $("send").addEventListener("click", async () => {
    await store();
    if (!db || !canWrite) { say("Not signed in here: use Export and hand the file over.", true); return; }
    try { await db.collection("places").doc(KEY).update({ sent: Date.now() }); say("Sent. Tell Claude to pull " + KEY + " in."); }
    catch (e) { say("Couldn't mark it sent: " + (e.message || e.code), true); }
  });

  // ---- go ----
  window.addEventListener("resize", size);
  if (window.ResizeObserver) new ResizeObserver(size).observe(stage);
  size(); fit(); pickTool("things"); info();
})();
</script>
</body>
